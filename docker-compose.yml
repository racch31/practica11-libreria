services:
  web:
    build: ./docker
    container_name: libreria_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: libreria
      DB_USER: libreria_user
      DB_PASS: libreria_pass
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: libreria_db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: libreria
      MYSQL_USER: libreria_user
      MYSQL_PASSWORD: libreria_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: libreria_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
